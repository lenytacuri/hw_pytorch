[project]
name = "hw-pytorch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Leny Tacuri", email = "lenytacuri1995@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "nvidia-ml-py>=13.615.71",
    "torch>=2.14.0",
    "torchsummary>=1.5.1",
]

[project.scripts]
hw-pytorch = "hw_pytorch:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
